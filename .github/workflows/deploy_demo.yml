name: Quantum Suite CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Job 1: Automated Unit Testing (Continuous Integration)
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up Python Environment
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        cache: "pip"

    - name: Install Quantum & Machine Learning Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Comprehensive Quantum Suite Automated Tests
      run: |
        python -m unittest discover -s tests -p "test_*.py"

  # Job 2: Automated Web UI Deployment (Continuous Deployment)
  deploy-web-demo:
    needs: test-and-validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Setup GitHub Pages Environment Configurations
      uses: actions/configure-pages@v3

    - name: Package Single-File UI Dashboard Asset
      uses: actions/upload-pages-artifact@v2
      with:
        # Uploads the root folder containing index.html directly
        path: '.'

    - name: Deploy Compiled Asset to Live GitHub Pages Domain
      id: deployment
      uses: actions/deploy-pages@v2
